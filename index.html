<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultra Store | Sushil Kumar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #000; color: #fff; font-family: 'Poppins', sans-serif; }
        .gold-glow { border: 2px solid #f97316; box-shadow: 0 0 20px rgba(249, 115, 22, 0.6); }
        .page { display: none; padding-bottom: 90px; }
        .active-page { display: block; animation: slideUp 0.4s ease-out; }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .jarvis-orb { width: 60px; height: 60px; background: radial-gradient(circle, #00f2fe 0%, #000 70%); border-radius: 50%; box-shadow: 0 0 20px #00f2fe; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { transform: scale(1); opacity: 0.8; } 50% { transform: scale(1.1); opacity: 1; } 100% { transform: scale(1); opacity: 0.8; } }
    </style>
</head>
<body onload="initStore()">

    <header class="p-4 flex justify-between items-center sticky top-0 bg-black/90 z-50 border-b border-gray-800">
        <div class="flex items-center gap-3">
            <img src="1000091514.jpg" class="w-10 h-10 rounded-xl gold-glow" onerror="this.src='https://cdn-icons-png.flaticon.com/512/888/888841.png'">
            <h1 class="font-bold text-lg text-orange-500 uppercase italic">Ultra Store</h1>
        </div>
        <div class="flex items-center gap-4">
            <div class="jarvis-orb" onclick="jarvisSpeak()"></div>
            <button class="bg-gray-800 p-2 rounded-full text-xl">🔍</button>
        </div>
    </header>

    <div id="home" class="page active-page p-4">
        <div onclick="payVIP()" class="w-full h-48 bg-gradient-to-tr from-orange-600 via-red-600 to-yellow-500 rounded-[35px] p-8 mb-8 flex flex-col justify-end shadow-2xl relative overflow-hidden cursor-pointer">
            <div class="absolute top-4 right-6 text-4xl opacity-20 font-black italic">ULTRA</div>
            <h2 class="text-3xl font-black italic">VIP PASS 👑</h2>
            <p class="text-sm font-medium">अनलॉक करें प्रीमियम फीचर्स - ₹500</p>
        </div>

        <h3 class="text-xl font-bold mb-4 px-2">🔥 Top 8 Essential Apps</h3>
        <div id="top-apps" class="grid grid-cols-4 gap-4 mb-10">
            </div>

        <h3 class="text-xl font-bold mb-4 px-2">📱 Social Media Apps</h3>
        <div id="social-apps" class="grid grid-cols-4 gap-4">
            </div>
    </div>

    <div id="dl-page" class="page fixed inset-0 bg-black z-[100] p-6 overflow-y-auto">
        <button onclick="closePage()" class="text-3xl mb-4">←</button>
        <div class="flex flex-col items-center">
            <img id="dl-icon" src="" class="w-24 h-24 rounded-3xl mb-4 gold-glow">
            <h2 id="dl-name" class="text-2xl font-bold"></h2>
            <div class="flex gap-4 my-6 text-sm">
                <span class="bg-gray-800 px-3 py-1 rounded-full">4.9 ★</span>
                <span class="bg-gray-800 px-3 py-1 rounded-full">1M+ Downloads</span>
            </div>
            <button onclick="startInstall()" class="w-full bg-green-600 py-4 rounded-2xl font-black text-xl shadow-lg shadow-green-900/40">INSTALL NOW</button>
            
            <div class="mt-8 w-full">
                <h4 class="font-bold mb-4">Screenshots</h4>
                <div class="flex gap-3 overflow-x-auto pb-4">
                    <div class="min-w-[120px] h-200 bg-gray-900 rounded-xl border border-gray-800"></div>
                    <div class="min-w-[120px] h-200 bg-gray-900 rounded-xl border border-gray-800"></div>
                </div>
            </div>

            <a href="https://t.me/your_telegram" class="w-full mt-6 bg-blue-600 py-3 rounded-xl text-center font-bold">Join My Telegram Channel</a>
        </div>
    </div>

    <div id="account" class="page p-6">
        <div class="glass p-6 rounded-[40px] text-center">
            <img src="1000091514.jpg" class="w-20 h-20 rounded-full mx-auto border-2 border-orange-500 mb-3 shadow-xl">
            <h2 class="text-xl font-bold">Sushil Kumar</h2>
            <p class="text-orange-500 text-[10px] uppercase tracking-widest mb-6">Store CEO</p>
            
            <div class="grid grid-cols-2 gap-3 mb-6">
                <div class="bg-black/50 p-4 rounded-2xl border border-white/10 text-left">
                    <small class="text-gray-500">Earnings</small>
                    <div class="text-xl font-bold text-green-500">₹0.00</div>
                </div>
                <div class="bg-black/50 p-4 rounded-2xl border border-white/10 text-left">
                    <small class="text-gray-500">Downloads</small>
                    <div class="text-xl font-bold">0</div>
                </div>
            </div>

            <div class="border-t border-white/10 pt-6 mt-6">
                <h4 class="font-bold text-orange-500 mb-4">🌐 Create Your App/Website</h4>
                <input id="web-link" type="text" placeholder="Enter Website Link" class="w-full bg-black border border-gray-700 p-3 rounded-xl mb-3 outline-none focus:border-orange-500">
                <button onclick="convertToApp()" class="w-full bg-white text-black py-3 rounded-xl font-black">CONVERT TO APK (FREE)</button>
                <p class="text-[10px] text-gray-500 mt-2 italic">*Custom Name modification: ₹500 Charge</p>
            </div>
        </div>
    </div>

    <nav class="fixed bottom-0 w-full bg-black/95 border-t border-gray-900 flex justify-around p-4 z-50">
        <button onclick="showPage('home')" class="text-center text-orange-500"><span class="text-2xl">🏠</span></button>
        <button class="text-center text-gray-500"><span class="text-2xl">🔍</span></button>
        <button onclick="payVIP()" class="text-center text-yellow-500"><span class="text-2xl">👑</span></button>
        <button onclick="showPage('account')" class="text-center text-gray-500"><span class="text-2xl">👤</span></button>
    </nav>

    <script>
        const topApps = [
            { name: "Sensi Pro", icon: "1000091514.jpg", type: "APK" },
            { name: "Free Fire", icon: "https://dl.dir.freefiremobile.com/common/web_static/freefiremax/images/home/download_btn.png", type: "PLAY" },
            { name: "PUBG Mobile", icon: "https://m.pubgmobile.com/en/images/logo.png", type: "PLAY" },
            { name: "CapCut", icon: "https://cdn.iconscout.com/icon/free/png-256/capcut-4573356-3801235.png", type: "PLAY" },
            { name: "Kinemaster", icon: "https://upload.wikimedia.org/wikipedia/commons/4/4c/KineMaster_logo.png", type: "PLAY" },
            { name: "VN Editor", icon: "https://vlllo.com/wp-content/uploads/2021/04/vn-video-editor-logo.png", type: "PLAY" },
            { name: "Candy Crush", icon: "https://upload.wikimedia.org/wikipedia/en/a/a2/Candy_Crush_Saga_logo.png", type: "PLAY" },
            { name: "Subway Surf", icon: "https://upload.wikimedia.org/wikipedia/en/a/ad/Subway_Surfers_Logo.png", type: "PLAY" }
        ];

        const socialApps = [
            { name: "Instagram", icon: "https://upload.wikimedia.org/wikipedia/commons/e/e7/Instagram_logo_2016.svg" },
            { name: "WhatsApp", icon: "https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" },
            { name: "YouTube", icon: "https://upload.wikimedia.org/wikipedia/commons/e/ef/Youtube_logo.png" },
            { name: "Facebook", icon: "https://upload.wikimedia.org/wikipedia/commons/5/51/Facebook_f_logo_%282019%29.svg" },
            { name: "Telegram", icon: "https://upload.wikimedia.org/wikipedia/commons/8/82/Telegram_logo.svg" },
            { name: "Snapchat", icon: "https://upload.wikimedia.org/wikipedia/en/a/ad/Snapchat_logo.svg" },
            { name: "Twitter", icon: "https://upload.wikimedia.org/wikipedia/commons/5/57/X_logo_2023_%28white%29.png" },
            { name: "TikTok", icon: "https://upload.wikimedia.org/wikipedia/en/a/a9/TikTok_logo.svg" },
            { name: "Discord", icon: "https://upload.wikimedia.org/wikipedia/en/9/98/Discord_logo.svg" },
            { name: "LinkedIn", icon: "https://upload.wikimedia.org/wikipedia/commons/c/ca/LinkedIn_logo_initials.png" }
        ];

        function initStore() {
            const topGrid = document.getElementById('top-apps');
            const socialGrid = document.getElementById('social-apps');
            
            topApps.forEach(app => {
                topGrid.innerHTML += renderCard(app);
            });
            
            socialApps.forEach(app => {
                socialGrid.innerHTML += renderCard({...app, type: 'PLAY'});
            });
            jarvisSpeak("नमस्ते सुशील कुमार भाई! जार्विस ऑनलाइन है और आपका स्टोर सुरक्षित है।");
        }

        function renderCard(app) {
            return `<div class="text-center" onclick="openDownload('${app.name}', '${app.icon}', '${app.type}')">
                        <img src="${app.icon}" class="w-14 h-14 mx-auto rounded-2xl mb-1 shadow-lg border border-gray-800 object-cover">
                        <p class="text-[9px] font-bold truncate">${app.name}</p>
                    </div>`;
        }

        function showPage(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page'));
            document.getElementById(id).classList.add('active-page');
        }

        function openDownload(name, icon, type) {
            document.getElementById('dl-name').innerText = name;
            document.getElementById('dl-icon').src = icon;
            document.getElementById('dl-page').classList.add('active-page');
        }

        function closePage() { document.getElementById('dl-page').classList.remove('active-page'); }

        function jarvisSpeak(text) {
            const speech = new SpeechSynthesisUtterance();
            speech.text = text || "नमस्ते, मैं जार्विस हूँ। सुशील भाई के स्टोर में आपका स्वागत है।";
            speech.lang = 'hi-IN';
            window.speechSynthesis.speak(speech);
        }

        function convertToApp() {
            const link = document.getElementById('web-link').value;
            if(!link) return alert("कृपया लिंक डालें!");
            alert("वेबसाइट को ऐप में बदला जा रहा है... जार्विस इसमें अपना कोड जोड़ रहा है।");
            setTimeout(() => alert("बधाई हो! आपका जार्विस-सक्षम APK तैयार है। नाम बदलने के लिए ₹500 सुशील भाई को भेजें।"), 2000);
        }

        function payVIP() {
            window.location.href = "upi://pay?pa=9934627814@ybl&pn=Sushil%20Kumar&am=500&cu=INR";
        }
    </script>
</body>
</html>
