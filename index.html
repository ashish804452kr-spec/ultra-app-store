<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultra Store | Ashish Kumar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; overflow-x: hidden; }
        .gold-glow { border: 2px solid #f97316; box-shadow: 0 0 15px rgba(249, 115, 22, 0.5); }
        .page { display: none; }
        .active-page { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .app-card { background: #111; border-radius: 22px; padding: 12px; text-align: center; border: 1px solid #222; }
        .app-icon { width: 65px; height: 65px; border-radius: 18px; margin: 0 auto 8px; object-cover: cover; background: #222; }
    </style>
</head>
<body onload="initStore()">

    <header class="p-4 flex justify-between items-center sticky top-0 bg-black/80 backdrop-blur-md z-50 border-b border-gray-900">
        <div class="flex items-center gap-3">
            <img src="https://raw.githubusercontent.com/2kr-spec/ultra-app-store/main/1000091514.jpg" class="w-10 h-10 rounded-xl gold-glow" onerror="this.src='https://cdn-icons-png.flaticon.com/512/888/888841.png'">
            <span class="font-bold text-xl tracking-tighter uppercase text-orange-500">Ultra Store</span>
        </div>
        <div class="flex gap-4">
            <span class="text-2xl" onclick="alert('नमस्ते! मैं जार्विस हूँ।')">🤖</span>
            <div class="bg-gray-800 p-2 rounded-full">🔍</div>
        </div>
    </header>

    <div id="home" class="page active-page p-4 pb-24">
        <div onclick="payVIP()" class="w-full h-44 bg-gradient-to-r from-orange-600 to-yellow-500 rounded-3xl p-6 mb-8 flex flex-col justify-end shadow-xl cursor-pointer">
            <h2 class="text-3xl font-black italic">VIP PASS 👑</h2>
            <p class="font-bold">सारे प्रीमियम ऐप्स अनलॉक करें - ₹500</p>
        </div>

        <h3 class="text-lg font-bold mb-4 flex items-center gap-2">🔥 Top Games & Tools</h3>
        <div id="app-grid" class="grid grid-cols-3 gap-4">
            </div>
    </div>

    <div id="account" class="page p-6 pb-24">
        <div class="bg-gray-900 p-8 rounded-[40px] border border-gray-800 text-center relative">
            <img id="profile-pic" src="https://raw.githubusercontent.com/2kr-spec/ultra-app-store/main/1000091514.jpg" class="w-24 h-24 rounded-full mx-auto border-4 border-orange-500 mb-4 shadow-2xl">
            <h2 class="text-2xl font-bold">Ashish Kumar</h2>
            <p class="text-orange-500 font-bold mb-8 italic">Store Owner & CEO</p>

            <div class="grid grid-cols-1 gap-4 mb-8">
                <div class="bg-black p-6 rounded-3xl border border-gray-800 text-left">
                    <small class="text-gray-500">कुल कमाई (My Wallet)</small>
                    <div class="text-3xl font-black text-green-500">₹0.00</div>
                </div>
            </div>

            <button onclick="alert('Withdrawal Limit: ₹500\n10% Admin Tax apply hoga.')" class="w-full bg-orange-600 py-4 rounded-2xl font-black text-lg shadow-lg shadow-orange-900/40 mb-4">WITHDRAW MONEY</button>
            <button onclick="alert('ऐप अपलोड करने का पेज कल सेट करेंगे!')" class="w-full bg-gray-800 py-3 rounded-xl font-bold">+ UPLOAD APK (EARN ₹2)</button>
        </div>
    </div>

    <nav class="fixed bottom-0 w-full bg-black/90 border-t border-gray-900 flex justify-around p-4 z-50">
        <button onclick="showPage('home')" class="text-center text-orange-500"><span class="block text-2xl">🏠</span><small>Home</small></button>
        <button class="text-center text-gray-500"><span class="block text-2xl">🔍</span><small>Search</small></button>
        <button onclick="payVIP()" class="text-center text-yellow-500 font-bold"><span class="block text-2xl">👑</span><small>VIP</small></button>
        <button onclick="showPage('account')" class="text-center text-gray-500"><span class="block text-2xl">👤</span><small>Account</small></button>
    </nav>

    <script>
        const apps = [
            { name: "Ultra Sensi", icon: "https://raw.githubusercontent.com/2kr-spec/ultra-app-store/main/1000091514.jpg", type: "APK" },
            { name: "Free Fire Max", icon: "https://dl.dir.freefiremobile.com/common/web_static/freefiremax/images/home/download_btn.png", type: "PLAY" },
            { name: "PUBG Mobile", icon: "https://m.pubgmobile.com/en/images/logo.png", type: "PLAY" },
            { name: "Instagram", icon: "https://upload.wikimedia.org/wikipedia/commons/e/e7/Instagram_logo_2016.svg", type: "PLAY" },
            { name: "YouTube", icon: "https://upload.wikimedia.org/wikipedia/commons/e/ef/Youtube_logo.png", type: "PLAY" },
            { name: "CapCut Pro", icon: "https://cdn.iconscout.com/icon/free/png-256/capcut-4573356-3801235.png", type: "PLAY" },
            { name: "WhatsApp", icon: "https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg", type: "PLAY" },
            { name: "Facebook", icon: "https://upload.wikimedia.org/wikipedia/commons/5/51/Facebook_f_logo_%282019%29.svg", type: "PLAY" },
            { name: "Snapchat", icon: "https://upload.wikimedia.org/wikipedia/en/a/ad/Snapchat_logo.svg", type: "PLAY" },
            { name: "Telegram", icon: "https://upload.wikimedia.org/wikipedia/commons/8/82/Telegram_logo.svg", type: "PLAY" },
            { name: "VN Editor", icon: "https://vlllo.com/wp-content/uploads/2021/04/vn-video-editor-logo.png", type: "PLAY" },
            { name: "Kinemaster", icon: "https://upload.wikimedia.org/wikipedia/commons/4/4c/KineMaster_logo.png", type: "PLAY" }
            // यहाँ आप 50+ तक लिस्ट बढ़ा सकते हैं
        ];

        function initStore() {
            const grid = document.getElementById('app-grid');
            apps.forEach(app => {
                grid.innerHTML += `
                    <div class="app-card" onclick="installApp('${app.name}', '${app.type}')">
                        <img src="${app.icon}" class="app-icon shadow-lg border border-gray-800" onerror="this.src='https://cdn-icons-png.flaticon.com/512/888/888841.png'">
                        <p class="text-[10px] font-bold truncate">${app.name}</p>
                        <p class="text-[8px] text-gray-500">${app.type === 'APK' ? 'Direct APK' : 'Play Store'}</p>
                    </div>`;
            });
        }

        function showPage(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page'));
            document.getElementById(id).classList.add('active-page');
        }

        function installApp(name, type) {
            if(type === 'PLAY') {
                alert(name + " के लिए Play Store खुल रहा है...");
                window.location.href = "https://play.google.com/store/search?q=" + encodeURIComponent(name);
            } else {
                alert("आशीष भाई का APK फाइल डाउनलोड हो रहा है...");
                window.location.href = "https://raw.githubusercontent.com/2kr-spec/ultra-app-store/main/1000091514.jpg"; // यहाँ APK का लिंक डालें
            }
        }

        function payVIP() {
            const upi = "upi://pay?pa=9934627814@ybl&pn=Ashish%20Kumar&am=500&cu=INR";
            window.location.href = upi;
        }
    </script>
</body>
</html>
