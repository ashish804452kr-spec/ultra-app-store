<!DOCTYPE html>
<html>
<head>
  <title>Azad Store</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: Arial;
      margin: 0;
      background: #f5f5f5;
    }

    header {
      background: #2ecc71;
      color: white;
      padding: 15px;
      text-align: center;
      font-size: 20px;
    }

    #search {
      width: 90%;
      margin: 10px;
      padding: 10px;
      font-size: 16px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      padding: 10px;
    }

    .card {
      background: white;
      padding: 10px;
      border-radius: 10px;
      text-align: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    img {
      width: 80px;
      height: 80px;
    }

    button {
      background: #2ecc71;
      color: white;
      border: none;
      padding: 8px;
      margin-top: 5px;
      border-radius: 5px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<header>Azad Store</header>

<input type="text" id="search" placeholder="Search Apps..." onkeyup="searchApp()">

<div class="grid" id="appList"></div>

<script>
let apps = [
  {
    name: "WhatsApp",
    image: "https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg",
    rating: "4.5",
    size: "50MB",
    downloads: "5B+",
    link: "https://play.google.com/store/apps/details?id=com.whatsapp"
  },
  {
    name: "YouTube",
    image: "https://upload.wikimedia.org/wikipedia/commons/b/b8/YouTube_Logo_2017.svg",
    rating: "4.4",
    size: "80MB",
    downloads: "10B+",
    link: "https://play.google.com/store/apps/details?id=com.google.android.youtube"
  }
];

function loadApps(data){
  let html = "";
  data.forEach(app => {
    html += `
    <div class="card">
      <img src="${app.image}">
      <h4>${app.name}</h4>
      <p>⭐ ${app.rating}</p>
      <p>${app.size}</p>
      <p>${app.downloads}</p>
      <button onclick="downloadApp('${app.link}')">Install</button>
    </div>
    `;
  });
  document.getElementById("appList").innerHTML = html;
}

function searchApp(){
  let value = document.getElementById("search").value.toLowerCase();
  let filtered = apps.filter(app => app.name.toLowerCase().includes(value));
  loadApps(filtered);
}

function downloadApp(link){
  window.open(link, "_blank");
}

loadApps(apps);
</script>

</body>
</html>
